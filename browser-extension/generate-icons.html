<!DOCTYPE html>
<html>
<head>
  <title>Generate ListingWriter Icons</title>
  <style>
    body { font-family: system-ui; padding: 40px; background: #1a1a2e; color: white; }
    h1 { margin-bottom: 20px; }
    .icons { display: flex; gap: 20px; margin-bottom: 30px; }
    .icon-container { text-align: center; }
    canvas { border-radius: 20%; }
    .size { margin-top: 8px; color: #888; font-size: 12px; }
    button { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-right: 10px; }
    button:hover { opacity: 0.9; }
    .instructions { background: #2a2a3e; padding: 20px; border-radius: 12px; margin-top: 20px; }
    code { background: #3a3a4e; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>ListingWriter Icon Generator</h1>

  <div class="icons">
    <div class="icon-container">
      <canvas id="icon128" width="128" height="128"></canvas>
      <div class="size">128x128</div>
    </div>
    <div class="icon-container">
      <canvas id="icon48" width="48" height="48"></canvas>
      <div class="size">48x48</div>
    </div>
    <div class="icon-container">
      <canvas id="icon16" width="16" height="16"></canvas>
      <div class="size">16x16</div>
    </div>
  </div>

  <button onclick="downloadAll()">Download All Icons</button>

  <div class="instructions">
    <h3>Instructions</h3>
    <ol>
      <li>Click "Download All Icons" above</li>
      <li>Save all three PNG files to the <code>browser-extension/icons/</code> folder</li>
      <li>Make sure they're named: <code>icon16.png</code>, <code>icon48.png</code>, <code>icon128.png</code></li>
      <li>Then load the extension in Chrome</li>
    </ol>
  </div>

  <script>
    const sizes = [128, 48, 16];

    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      const radius = size * 0.1875; // Rounded corners

      // Create gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#8b5cf6');
      gradient.addColorStop(1, '#6366f1');

      // Draw rounded rectangle
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();

      ctx.fillStyle = gradient;
      ctx.fill();

      // Draw "L"
      ctx.fillStyle = 'white';
      ctx.font = `800 ${size * 0.5625}px system-ui, -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('L', size / 2, size / 2 + size * 0.05);
    }

    // Draw all icons
    sizes.forEach(size => {
      const canvas = document.getElementById('icon' + size);
      drawIcon(canvas);
    });

    function downloadAll() {
      sizes.forEach(size => {
        const canvas = document.getElementById('icon' + size);
        const link = document.createElement('a');
        link.download = `icon${size}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
