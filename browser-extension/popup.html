<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <title>ListingWriter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">L</div>
        <span class="logo-text">ListingWriter</span>
      </div>
      <button id="theme-toggle" class="theme-btn" title="Toggle theme">
        <span class="theme-icon">&#9790;</span>
      </button>
    </header>

    <!-- Form View -->
    <div id="form-view" class="view active">
      <!-- Image Upload -->
      <div class="section">
        <label class="label">Photos (up to 3)</label>
        <div id="drop-zone" class="drop-zone">
          <input type="file" id="file-input" accept="image/*" multiple hidden>
          <div class="drop-zone-text">
            <span class="drop-icon">+</span>
            <span>Drop images or click to upload</span>
          </div>
        </div>
        <div id="image-preview" class="image-preview"></div>
      </div>

      <!-- Item Details -->
      <div class="section">
        <label class="label" for="item-name">Item Name</label>
        <input type="text" id="item-name" class="input" placeholder="e.g., IKEA Malm Dresser">
      </div>

      <div class="row">
        <div class="section half">
          <label class="label" for="price">Price ($)</label>
          <input type="number" id="price" class="input" placeholder="0">
        </div>
        <div class="section half">
          <label class="label" for="condition">Condition</label>
          <select id="condition" class="input">
            <option value="New">New</option>
            <option value="Like New">Like New</option>
            <option value="Good" selected>Good</option>
            <option value="Fair">Fair</option>
            <option value="For Parts">For Parts</option>
          </select>
        </div>
      </div>

      <div class="section">
        <label class="label" for="category">Category</label>
        <select id="category" class="input">
          <option value="Furniture">Furniture</option>
          <option value="Electronics">Electronics</option>
          <option value="Clothing">Clothing</option>
          <option value="Vehicles">Vehicles</option>
          <option value="Home & Garden">Home & Garden</option>
          <option value="Sports">Sports</option>
          <option value="Toys">Toys</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="section">
        <label class="label" for="details">Additional Details (optional)</label>
        <textarea id="details" class="input textarea" placeholder="Any extra info buyers should know..."></textarea>
      </div>

      <button id="generate-btn" class="btn primary">
        <span class="btn-text">Generate Listings</span>
        <span class="btn-loader hidden"></span>
      </button>
    </div>

    <!-- Results View -->
    <div id="results-view" class="view">
      <div class="success-banner">
        <span class="success-icon">&#10003;</span>
        <span>Listings Ready!</span>
      </div>

      <div id="results-container" class="results"></div>

      <button id="back-btn" class="btn secondary">Create Another</button>
    </div>

    <!-- Error View -->
    <div id="error-view" class="view">
      <div class="error-content">
        <div class="error-icon">!</div>
        <h3>Something went wrong</h3>
        <p id="error-message">Please try again.</p>
        <button id="retry-btn" class="btn primary">Try Again</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
